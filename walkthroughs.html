 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;

<style>
  /* Same window treatment as the SARATHI demo: capped, centred, product-like.
     Every company, figure and date below is invented. */
  :root{
    --bg:#faf6ee; --panel:#ffffff; --sunk:#f2ece0; --line:#ddd4c4;
    --ink:#1b1a17; --dim:#6f6859; --accent:#1e3a6d; --accent-soft:#e8ecf4;
    --amber:#9a6b14; --amber-soft:#f6ecd8; --ok:#2f6b4f; --warn:#a33c2f;
    --display:"Newsreader",Georgia,serif;
    --sans:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    color-scheme:light;
    /* identical up to 2200px; only genuinely huge panels scale up */
    font-size:clamp(16px, calc(16px + (100vw - 2200px) * .0155), 22px);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#f2ece0;
       color:var(--ink);font-family:var(--sans);font-size:.9375rem;line-height:1.55;
       overflow-x:hidden;
       padding-left:max(16px,env(safe-area-inset-left,0px));
       padding-right:max(16px,env(safe-area-inset-right,0px));
       padding-block:clamp(10px,1.6vh,22px) clamp(12px,1.8vh,24px);font-size:clamp(.9062rem,.42vw + .85rem,1.0625rem)}
  .app{width:100%;max-width:min(100rem,100%);margin-inline:auto;background:var(--bg);border:1px solid var(--line);
       border-radius:12px;overflow:hidden;box-shadow:0 14px 40px rgba(60,48,28,.13);
       display:flex;flex-direction:column;height:calc(100dvh - clamp(26px,3.6vh,48px));min-height:460px}
  .banner{background:color-mix(in srgb,var(--h) 12%,transparent);color:var(--h);
          border-bottom:1px solid color-mix(in srgb,var(--h) 25%,var(--line));font-family:var(--mono);font-size:.6875rem;
          font-weight:600;letter-spacing:.09em;text-transform:uppercase;text-align:center;
          padding:.4375rem .75rem;flex:none}
  header{flex:none;padding:.875rem 1.25rem;border-bottom:1px solid var(--line)}
  .hrow{display:flex;align-items:baseline;gap:.875rem;flex-wrap:wrap}
  .brand{font-family:var(--display);font-size:1.1875rem;font-weight:500}
  .hint{font-family:var(--mono);font-size:.6875rem;color:var(--dim);margin-left:auto}

  .shell{flex:1;display:grid;grid-template-columns:16.25rem 1fr;min-height:0;overflow:hidden}
  nav{border-right:1px solid var(--line);overflow-y:auto;padding:.75rem 0}
  nav button{display:block;width:100%;text-align:left;font:inherit;font-size:.8438rem;
             color:var(--dim);background:transparent;border:0;border-left:3px solid transparent;
             padding:.5625rem 1rem;cursor:pointer}
  nav button:hover{color:var(--ink);background:var(--sunk)}
  nav button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent);
                                  background:var(--sunk);font-weight:600}
  nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  nav .lbl{font-family:var(--mono);font-size:.5938rem;letter-spacing:.14em;text-transform:uppercase;
           color:var(--dim);padding:.875rem 1rem .375rem;opacity:.85;
           display:flex;align-items:center;gap:.4375rem}
  nav .lbl::before{content:"";width:.5rem;height:.5rem;border-radius:50%;flex:none;
                   background:var(--lh,var(--accent))}
  nav .lbl[data-g="Data"]{--lh:#1e3a6d}
  nav .lbl[data-g="Analytics"]{--lh:#0f6257}
  nav .lbl[data-g="Operations"]{--lh:#9a4a22}
  nav .lbl[data-g="Reporting"]{--lh:#6a3566}
  nav .lbl[data-g="Automation"]{--lh:#2f6b4f}

  main{display:flex;flex-direction:column;min-width:0;min-height:0}
  .top{display:flex;align-items:flex-start;gap:.875rem;padding:1.125rem 1.375rem .875rem;flex-wrap:wrap;
       border-bottom:1px solid var(--line);flex:none}
  .top h2{font-family:var(--display);font-size:1.75rem;font-weight:500;margin:0;color:var(--ink)}
  .top p{font-size:.8438rem;color:var(--dim);max-width:62ch;margin-top:.1875rem}
  .play{font:inherit;font-size:.8438rem;font-weight:600;color:#ffffff;background:var(--accent);
        border:0;border-radius:8px;padding:.5625rem 1rem;cursor:pointer;margin-left:auto;flex:none}
  .play:hover{filter:brightness(1.08)} .play:disabled{opacity:.45;cursor:default;filter:none}
  .play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .stagewrap{flex:1;overflow-y:auto;padding:1.25rem 1.375rem 1.625rem;min-height:0}

  /* pipeline */
  .pipe{display:flex;flex-direction:column;gap:.5625rem}
  .st{display:grid;grid-template-columns:1.875rem 1fr auto;gap:.75rem;align-items:center;
      padding:.6875rem .875rem;background:var(--panel);border:1px solid var(--line);border-radius:9px;
      opacity:.4;transition:opacity .3s,border-color .3s}
  .st.on{opacity:1;border-color:var(--accent)}
  .st.done{opacity:1;border-color:var(--line)}
  .st .ix{font-family:var(--mono);font-size:.6875rem;color:var(--dim);text-align:center}
  .st.done .ix::after{content:"\2713";color:var(--ok)}
  .st.done .ix span{display:none}
  .st .nm{font-size:.9062rem;min-width:0}
  .st .nm small{display:block;color:var(--dim);font-size:.7812rem}
  .st .vl{font-family:var(--mono);font-size:.8125rem;color:var(--accent);font-variant-numeric:tabular-nums;
          white-space:nowrap}
  .st.on .vl{color:var(--amber)}

  /* bars + gauges */
  .bars{display:flex;flex-direction:column;gap:.6875rem;margin-top:.25rem}
  .bar{display:grid;grid-template-columns:8.25rem 1fr auto;gap:.75rem;align-items:center;font-size:.8438rem}
  .bar .tr{height:9px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;overflow:hidden}
  .bar .fl{height:100%;width:0;background:var(--accent);transition:width .9s cubic-bezier(.3,.9,.3,1)}
  .bar .fl.g{background:var(--ok)} .bar .fl.w{background:var(--warn)}
  .bar .pc{font-family:var(--mono);font-size:.7812rem;color:var(--dim);font-variant-numeric:tabular-nums;
           min-width:3.875rem;text-align:right}
  .bar.gap .pc{color:var(--amber)}

  /* table */
  table{border-collapse:collapse;width:100%;font-size:.8438rem;margin-top:.25rem}
  th,td{text-align:left;padding:.375rem .625rem .375rem 0;border-bottom:1px solid var(--line)}
  th{font-family:var(--mono);font-size:.625rem;letter-spacing:.09em;text-transform:uppercase;
     color:var(--dim);font-weight:600}
  td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  tr.q{opacity:0;transform:translateY(5px);transition:all .35s}
  tr.q td{border-color:transparent}
  tr.q.in td{border-color:var(--line)}
  tr.q.in{opacity:1;transform:none}
  .flag{font-family:var(--mono);font-size:.625rem;font-weight:600;padding:.125rem .4375rem;border-radius:4px}
  .flag.ok{color:var(--ok);background:#e4f0e9} .flag.lo{color:var(--amber);background:var(--amber-soft)}

  /* slides */
  .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.5625rem;margin-top:.25rem}
  .sl{aspect-ratio:16/10;background:var(--panel);border:1px solid var(--line);border-radius:6px;
      display:flex;flex-direction:column;gap:.25rem;padding:.5rem;opacity:0;transform:scale(.94);
      transition:all .3s}
  .sl.in{opacity:1;transform:none}
  .sl i{display:block;height:3px;background:var(--line);border-radius:2px}
  .sl i.t{width:70%;background:var(--accent);height:4px}
  .sl .ch{flex:1;background:linear-gradient(to top,var(--accent-soft) 0%,var(--accent-soft) 40%,transparent 40%);
          border-radius:3px;margin-top:.125rem}
  .sl .n{font-family:var(--mono);font-size:.5312rem;color:var(--dim);text-align:right}

  /* mail split */
  .split{display:grid;grid-template-columns:1fr 1fr;gap:.875rem;margin-top:.25rem}

  /* ---- category hues: one per family, used as accents on the cream ---- */
  .app[data-hue="Data"]      {--h:#1e3a6d; --hs:#e7ecf5}
  .app[data-hue="Analytics"] {--h:#0f6257; --hs:#e2f0ec}
  .app[data-hue="Operations"]{--h:#9a4a22; --hs:#f8e9df}
  .app[data-hue="Reporting"] {--h:#6a3566; --hs:#f2e7f1}
  .app[data-hue="Automation"]{--h:#2f6b4f; --hs:#e4f0e9}
  .app{--h:#1e3a6d; --hs:#e7ecf5}

  .lede{font-size:.84rem;color:var(--dim);margin:.3125rem 0 0;max-width:70ch}
  .lede b{color:var(--ink);font-weight:600}

  /* ---- the band that carries the point of each system ---- */
  .hero{border-radius:.75rem;overflow:hidden;margin-bottom:1.125rem;
        border:1px solid color-mix(in srgb,var(--h) 30%,var(--line))}
  .hero .plain{margin:0;padding:1rem 1.25rem;background:var(--h);color:#fff;
               font-size:1.0625rem;line-height:1.45;font-weight:600}
  .hero .tech{margin:0;padding:.75rem 1.25rem .375rem;background:var(--hs);
              font-size:.8125rem;line-height:1.5;color:var(--dim)}
  .ba{display:flex;align-items:stretch;gap:.625rem;margin:0;flex-wrap:wrap;
      background:var(--hs);padding:.75rem 1.25rem 1rem}
  .ba .cell{min-width:0}
  .ba .k{display:block;font-family:var(--mono);font-size:.5625rem;letter-spacing:.14em;
         text-transform:uppercase;color:var(--dim);margin-bottom:.1875rem}
  .ba .cell{background:#fff;border:1px solid color-mix(in srgb,var(--h) 22%,var(--line));
            border-radius:.5rem;padding:.5rem .75rem}
  .ba .v{display:block;font-size:.9375rem;font-weight:700;line-height:1.25}
  .ba .was .v{color:var(--dim);text-decoration:line-through;text-decoration-thickness:1px;
              text-decoration-color:rgba(0,0,0,.25);font-weight:400}
  .ba .now .v{color:var(--h)}
  .ba .arw{align-self:center;color:var(--h);font-size:1.125rem;line-height:1;opacity:.7}
  .ba .mt{margin-left:auto;align-self:center;font-family:var(--mono);font-size:.6875rem;
          color:var(--h);text-align:right;font-weight:600}

  /* ---- hue picked up by the rest of the stage ---- */
  .st.on{border-color:var(--h);background:var(--hs);
         box-shadow:0 0 0 2px color-mix(in srgb,var(--h) 16%,transparent)}
  .st.done{background:#fff;border-color:color-mix(in srgb,var(--ok) 32%,var(--line))}
  .st.done .vl{color:var(--ok)}
  .st .vl{color:var(--h)}
  .play{background:var(--h)}
  nav button[aria-current="true"]{border-left-color:var(--h)}
  .bar .fl{background:var(--h)}
  .ticker b{color:var(--h)}
  .sl i.t{background:var(--h)}
  .sl .ch{background:linear-gradient(to top,var(--hs) 0%,var(--hs) 40%,transparent 40%)}
  .running{display:inline-flex;align-items:center;gap:.4375rem}
  .running::before{content:"";width:.4375rem;height:.4375rem;border-radius:50%;
                   background:var(--h);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  @media (max-width:640px){
    .split{grid-template-columns:1fr}
    /* the band stacks here, so a sideways arrow points at nothing */
    .ba{display:grid;grid-template-columns:1fr;gap:.5rem}
    .ba .arw{display:none}
    .ba .mt{margin-left:0;text-align:left}
  }
  .box{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:.8125rem}
  .box h4{font-family:var(--mono);font-size:.625rem;letter-spacing:.1em;text-transform:uppercase;
          color:var(--dim);margin:0 0 9px;font-weight:600}
  .row{display:flex;align-items:center;gap:.5625rem;padding:.375rem 0;border-bottom:1px solid var(--line);
       font-size:.8438rem;opacity:0;transform:translateX(-6px);transition:all .3s}
  .row.in{opacity:1;transform:none}
  .row:last-child{border-bottom:0}
  .row .tick{color:var(--ok);font-family:var(--mono);font-size:.75rem}
  .row .pend{color:var(--dim);font-family:var(--mono);font-size:.6875rem;margin-left:auto}

  .watching{font-family:var(--mono);font-size:.625rem;letter-spacing:.13em;
            text-transform:uppercase;color:var(--h);font-weight:600;
            padding:.75rem 1.375rem 0;margin:0}
  .ticker{font-family:var(--mono);font-size:.75rem;color:var(--dim);margin-top:1rem;
          border-top:1px solid var(--line);padding-top:.75rem;min-height:40px;white-space:pre-line}
  .ticker b{color:var(--accent);font-weight:600}
  .note{font-family:var(--mono);font-size:.6875rem;color:var(--dim);margin-top:.875rem;line-height:1.7}
  .note a{color:var(--accent)}

  @media (max-width:860px){
    .app{height:auto;max-height:none;min-height:0;border-radius:10px}
    .shell{grid-template-columns:1fr}
    nav{border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;
        padding:.5rem;gap:.25rem}
    nav .lbl{display:none}
    nav button{width:auto;border-left:0;border-bottom:2px solid transparent;border-radius:6px;
               padding:.4375rem .6875rem;font-size:.7812rem}
    nav button[aria-current="true"]{border-left:0;border-bottom-color:var(--accent)}
    .stagewrap{min-height:380px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
<div class="banner">Demo builds &middot; invented companies and figures &middot; not connected to any live system</div>

<header>
  <div class="hrow">
    <span class="brand">Systems walkthroughs</span>
    <span class="hint" id="hint">Playing&hellip;</span>
  </div>
  <p class="lede">Five systems we designed, built and run in production, each replayed here end to end
    on <b>invented data</b>. Pick any one &mdash; it plays by itself.</p>
</header>

<div class="shell">
  <nav id="nav"></nav>
  <main>
      <p class="watching" id="watching"></p>
      <div class="top">
      <div style="min-width:0">
        <h2 id="t">&mdash;</h2>
      </div>
      <button class="play" id="play" type="button">&#9654; Play</button>
    </div>
    <div class="stagewrap">
      <div class="hero" id="hero"></div>
      <div id="stage"></div>
      <div class="ticker" id="ticker"></div>
      <p class="note" id="note"></p>
    </div>
  </main>
</div>
</div>

<script>
(function () {
  var reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var nav = document.getElementById("nav"), stage = document.getElementById("stage"),
      ticker = document.getElementById("ticker"), note = document.getElementById("note"),
      play = document.getElementById("play"), tEl = document.getElementById("t"),
      dEl = null;
  var busy = false, cur = 0;

  function wait(ms){ return new Promise(function(r){ setTimeout(r, reduce ? Math.min(ms,80) : ms); }); }
  function el(h){ var d=document.createElement("div"); d.innerHTML=h; return d.firstElementChild; }
  function say(t){ ticker.innerHTML = t; }
  async function count(node, to, suffix, ms){
    suffix = suffix || ""; ms = ms || 700;
    if (reduce) { node.textContent = to.toLocaleString("en-IN") + suffix; return; }
    var steps = 26, i = 0;
    while (i++ < steps) {
      node.textContent = Math.round(to * (i/steps)).toLocaleString("en-IN") + suffix;
      await wait(ms/steps);
    }
  }

  var DEMOS = [
    {
      g:"Analytics", t:"Executive analytics suite",
      plain:"The whole leadership reporting pack rebuilt by a single command, and written as one file that opens anywhere without a login or a server.",
      was:"About three days a month", now:"One command, minutes", mt:"Full leadership pack<br>one self-contained file",
      d:"One command rebuilds the full leadership pack across every group entity and writes a single self-contained file that needs no server to open.",
      note:"Entities, revenue and growth figures are invented.",
      build:function(){
        stage.innerHTML="";
        stage.appendChild(el('<div class="bars" id="bb">'+
          ['Meridian Labs','Northbridge Ltd','Blueport SARL','Cascade LLC','Harbourline Co']
          .map(function(n){return '<div class="bar"><span>'+n+'</span><span class="tr"><span class="fl"></span></span><span class="pc">&mdash;</span></div>';}).join("")+'</div>'));
        stage.appendChild(el('<table><tr><th>Measure</th><th class="num">This year</th><th class="num">Last year</th><th class="num">Growth</th></tr>'+
          '<tr class="q"><td>Revenue</td><td class="num">1,033</td><td class="num">890</td><td class="num">+16.1%</td></tr>'+
          '<tr class="q"><td>Gross margin</td><td class="num">31.4%</td><td class="num">29.8%</td><td class="num">+1.6pp</td></tr>'+
          '<tr class="q"><td>Top 10 products</td><td class="num">47.2%</td><td class="num">44.9%</td><td class="num">+2.3pp</td></tr></table>'));
        say("");
      },
      run:async function(){
        say("Pulling sales for <b>every entity</b>, applying the group mapping…");
        await wait(700);
        var fl=[].slice.call(stage.querySelectorAll(".fl")), pc=[].slice.call(stage.querySelectorAll(".pc"));
        var v=[92,71,58,44,36], r=[318,242,198,151,124];
        for(var i=0;i<fl.length;i++){
          fl[i].style.width=v[i]+"%";
          await count(pc[i], r[i], "", 420);
          await wait(90);
        }
        say("Entity views built. Consolidating…");
        await wait(600);
        var rows=[].slice.call(stage.querySelectorAll("tr.q"));
        for(var j=0;j<rows.length;j++){ rows[j].classList.add("in"); await wait(260); }
        await wait(300);
        say("Pack written as <b>one self-contained file</b> &mdash; no login, no server, still opens in a year.\nAssembly went from about three days a month to a single command.");
      }
    },
    {
      g:"Operations", t:"Field force claim reconciliation",
      plain:"Travel claims from field staff checked automatically against where their phones actually went, so a supervisor only looks at the ones that disagree.",
      was:"About two days a month", now:"Minutes, exceptions only", mt:"6 claims checked<br>2 sent for review",
      d:"Measured travel from the field app is compared with what was claimed, and only the gaps are put in front of a supervisor.",
      note:"Staff names, distances and amounts are invented.",
      build:function(){
        stage.innerHTML="";
        stage.appendChild(el('<table><tr><th>Field staff</th><th class="num">Claimed km</th><th class="num">Measured km</th><th class="num">Gap</th><th>Result</th></tr>'+
          [['R. Menon',412,408,'-4','ok'],['S. Iyer',388,386,'-2','ok'],['A. Bose',455,331,'-124','flag'],
           ['K. Nair',290,288,'-2','ok'],['P. Rao',510,502,'-8','ok'],['V. Shah',377,249,'-128','flag']]
          .map(function(r){return '<tr class="q"><td>'+r[0]+'</td><td class="num">'+r[1]+'</td><td class="num">'+r[2]+
            '</td><td class="num">'+r[3]+'</td><td><span class="flag '+(r[4]==='ok'?'ok">Within tolerance':'lo">Review')+'</span></td></tr>';}).join("")+'</table>'));
        say("");
      },
      run:async function(){
        say("Reading location batches for <b>6 staff</b> over the month…");
        await wait(800);
        var rows=[].slice.call(stage.querySelectorAll("tr.q"));
        for(var i=0;i<rows.length;i++){
          rows[i].classList.add("in");
          say("Reconciling <b>"+rows[i].cells[0].textContent+"</b>…");
          await wait(340);
        }
        await wait(300);
        say("<b>2 of 6</b> outside tolerance and sent for review. The other four need no human at all.\nClaim checking went from about two days a month to minutes.");
      }
    },
    {
      g:"Analytics", t:"Plant capacity dashboard",
      plain:"What each production line can make against what it actually made, read live from the ERP &mdash; and where no capacity model exists, it shows nothing rather than inventing a number.",
      was:"Asked around, half-remembered", now:"Live on every request", mt:"5 lines reporting<br>1 honestly blank",
      d:"Live utilisation per production line, read from the ERP on every request. Where no capacity model exists, it shows nothing rather than guessing.",
      note:"Division names and utilisation figures are invented.",
      build:function(){
        stage.innerHTML="";
        stage.appendChild(el('<div class="bars">'+
          [['Sterile &middot; Line 1','g'],['Sterile &middot; Line 2','g'],['Tablets &middot; Line 1',''],
           ['Tablets &middot; Line 2','w'],['Blister pack &middot; Line 1',''],['Cold chain &middot; Line 1','gap']]
          .map(function(n){return '<div class="bar'+(n[1]==='gap'?' gap':'')+'"><span>'+n[0]+
            '</span><span class="tr"><span class="fl '+(n[1]==='gap'?'':n[1])+'"></span></span><span class="pc">&mdash;</span></div>';}).join("")+'</div>'));
        say("");
      },
      run:async function(){
        say("Querying production output per line, fresh…");
        await wait(700);
        var bars=[].slice.call(stage.querySelectorAll(".bar"));
        var v=[88,81,64,97,72,null];
        for(var i=0;i<bars.length;i++){
          var fl=bars[i].querySelector(".fl"), pc=bars[i].querySelector(".pc");
          if(v[i]===null){
            pc.textContent="no model";
            say("<b>Cold chain &middot; Line 1</b> has no rated capacity supplied by operations.");
            await wait(900);
          } else {
            fl.style.width=v[i]+"%";
            await count(pc, v[i], "%", 420);
            await wait(110);
          }
        }
        await wait(200);
        say("Five lines reporting. The sixth shows <b>no figure</b>, not an estimate.\nA dashboard that invents a denominator is worse than one that admits the gap.");
      }
    },
    {
      g:"Reporting", t:"Operations review deck generator",
      plain:"The monthly operations deck assembled straight from the data, with charts that are real objects you can click into, not pasted pictures.",
      was:"About two days, by hand", now:"Minutes, one command", mt:"22 slides &middot; 12 tables<br>24 native charts",
      d:"A 22-slide monthly review with native editable charts, rebuilt from three source extracts whenever one of them is revised.",
      note:"Slide contents are illustrative only.",
      build:function(){
        stage.innerHTML="";
        var deck=el('<div class="deck"></div>');
        for(var i=1;i<=22;i++){
          deck.appendChild(el('<div class="sl"><i class="t"></i><i></i><div class="ch"></div><div class="n">'+i+'</div></div>'));
        }
        stage.appendChild(deck); say("");
      },
      run:async function(){
        say("Reading <b>3 source extracts</b>: production, dispatch, manpower…");
        await wait(800);
        var sl=[].slice.call(stage.querySelectorAll(".sl"));
        var secs=[[0,3,"Summary"],[3,8,"Production"],[8,13,"Dispatch"],[13,17,"Manpower"],[17,20,"Quality"],[20,22,"Actions"]];
        for(var s=0;s<secs.length;s++){
          say("Building <b>"+secs[s][2]+"</b>…");
          for(var i=secs[s][0];i<secs[s][1];i++){ sl[i].classList.add("in"); await wait(95); }
          await wait(160);
        }
        await wait(260);
        say("22 slides, <b>24 native charts</b>, 12 tables. Charts are real objects, not pasted pictures, so anyone can click into the data.\nDeck build went from about two days to minutes.");
      }
    },
    {
      g:"Automation", t:"Office automation suite",
      plain:"One master workbook split into a report per recipient, each with its covering email drafted and left in the mailbox for a person to read and send.",
      was:"About a day", now:"Under ten minutes", mt:"6 reports &middot; 6 drafts<br>nothing sent automatically",
      d:"One master workbook split into per-recipient reports with the covering mail prepared — and left as drafts for a person to send.",
      note:"Recipient names are invented.",
      build:function(){
        stage.innerHTML="";
        stage.appendChild(el('<div class="split">'+
          '<div class="box"><h4>Slicing the master workbook</h4>'+
          ['North region','West region','South region','East region','Exports','Modern trade']
            .map(function(n){return '<div class="row"><span class="tick">\u2713</span><span>'+n+'</span><span class="pend">sheet</span></div>';}).join("")+
          '</div>'+
          '<div class="box"><h4>Drafts prepared &middot; not sent</h4>'+
          ['R. Menon','S. Iyer','A. Bose','K. Nair','P. Rao','V. Shah']
            .map(function(n){return '<div class="row"><span class="tick">\u2713</span><span>'+n+'</span><span class="pend">draft</span></div>';}).join("")+
          '</div></div>'));
        say("");
      },
      run:async function(){
        var left=[].slice.call(stage.querySelectorAll(".box:first-child .row"));
        var right=[].slice.call(stage.querySelectorAll(".box:last-child .row"));
        say("Splitting the master workbook by recipient, keeping each slice's formatting…");
        for(var i=0;i<left.length;i++){ left[i].classList.add("in"); await wait(210); }
        await wait(300);
        say("Preparing a covering mail for each…");
        for(var j=0;j<right.length;j++){ right[j].classList.add("in"); await wait(210); }
        await wait(300);
        say("Six reports, six drafts, <b>nothing sent</b>. A person opens the mailbox and decides.\nThe cycle went from about a day to under ten minutes.");
      }
    }
  ];

  // build nav
  var groups = {};
  DEMOS.forEach(function (d, i) { (groups[d.g] = groups[d.g] || []).push(i); });
  Object.keys(groups).forEach(function (g) {
    nav.appendChild(el('<div class="lbl" data-g="' + g + '">' + g + '</div>'));
    groups[g].forEach(function (i) {
      var b = el('<button type="button">' + DEMOS[i].t + '</button>');
      b.addEventListener("click", function () { if (!busy) select(i, true); });
      b.dataset.i = i;
      nav.appendChild(b);
    });
  });

  var hero = document.getElementById("hero"), hint = document.getElementById("hint");
  var app = document.querySelector(".app");

  function select(i, autoplay) {
    cur = i;
    [].forEach.call(nav.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-current", +b.dataset.i === i ? "true" : "false");
    });
    var d = DEMOS[i];
    app.setAttribute("data-hue", d.g);
    document.getElementById("watching").textContent = d.g + " — watching it run";
    tEl.textContent = d.t;
    note.textContent = d.note;
    hero.innerHTML =
      '<p class="plain">' + d.plain + '</p>' +
      '<p class="tech">' + d.d + '</p>' +
      '<div class="ba">' +
        '<span class="cell was"><span class="k">Before</span><span class="v">' + d.was + '</span></span>' +
        '<span class="arw">&rarr;</span>' +
        '<span class="cell now"><span class="k">After</span><span class="v">' + d.now + '</span></span>' +
        '<span class="mt">' + d.mt + '</span>' +
      '</div>';
    d.build();
    say("");
    if (autoplay) start();
  }

  async function start() {
    if (busy) return;
    busy = true; play.disabled = true;
    play.textContent = "Running\u2026";
    hint.innerHTML = '<span class="running">Playing</span>';
    DEMOS[cur].build();
    try { await DEMOS[cur].run(); } catch (e) {}
    play.innerHTML = "&#9654; Play again"; play.disabled = false; busy = false;
    hint.textContent = "Pick another system to watch it run";
  }

  play.addEventListener("click", function () { start(); });
  nav.addEventListener("click", function () {});

  select(0, true);
})();
</script>

</body>
</html>
