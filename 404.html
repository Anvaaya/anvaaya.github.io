<html lang="en" data-theme="light">

<meta name="description" content="">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="Anvaaya">

<style>
:root{color-scheme:light;box-sizing:border-box;
      padding-top:env(safe-area-inset-top,0px);
      padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;
     background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
</head>
<body>
<title>Page not found</title>
<style>
:root{--ink:#14161c;--body:#434a55;--muted:#767d88;--paper:#fbfaf7;--accent:#1d3b6e}
/* guarded the same way the profile is: the shell pins data-theme="light",
   so every page of the site looks the same to every reader */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#f3f3f1;--body:#c2c8d0;--muted:#8d949d;
  --paper:#0c0f14;--accent:#8fb0e8;color-scheme:dark}}
body{background:var(--paper);color:var(--body);margin:0;min-height:90vh;display:flex;
  align-items:center;justify-content:center;text-align:center;
  font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:Newsreader,Georgia,serif;font-size:clamp(28px,6vw,44px);font-weight:600;
   color:var(--ink);margin:0 0 10px;letter-spacing:-.02em}
p{font-size:16px;margin:0 0 24px;color:var(--muted)}
a{display:inline-block;background:var(--accent);color:var(--paper);text-decoration:none;
  font-weight:700;padding:12px 22px;border-radius:999px}
</style>
<div>
  <h1>That page isn't here</h1>
  <p>The link may be out of date, or mistyped.</p>
  <a href="/">Go to the home page</a>
</div>

</body>
</html>
